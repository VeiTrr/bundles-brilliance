# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version = 0.1
maven_group = dev.vt
archives_name= bundles_brilliance
enabled_platforms = fabric,forge,neoforge
mod_id = bundles_brilliance
mod_name = Bundle's Brilliance
mod_description = Upgrade your inventory with bundles that specialize in different tasks!
mod_authors = VeiTr
mod_license = MIT
mod_sources = https://github.com/VeiTrr/bundles-brilliance
mod_issue_tracker = https://github.com/VeiTrr/bundles-brilliance/issues

# Minecraft properties
minecraft_version = 1.21
yarn_mappings = 1.21+build.9
# Specify the minimum Minecraft version required to run the mod.
# Else, leave it as 0, and it will default to the major version of the Minecraft version specified above. 1.21.1 -> 1.21
minimum_minecraft_version = 0

# Dependencies
fabric_api_version = 0.100.7+1.21
fabric_loader_version = 0.16.7
forge_version = 1.21-51.0.33
neoforge_version = 21.0.167
yarn_mappings_patch_neoforge_version = 1.21+build.4

# Fabric
modmenu_version = 11.0.0